# non-minecraft values
org.gradle.jvmargs=-Xmx2048M
jetbrainsAnnotationsVersion=23.0.0

# gradle kotlin jvm plugin breaks without this
kotlin.stdlib.default.dependency=false

# needed for mixins to work for forge
asmVersion=9.4

# mod info
modID=oneironaut
modVersion=0.5.0
mavenGroup=net.beholderface.oneironaut

# publishing
curseforgeId=
modrinthId=

# core
minecraftVersion=1.20.1
yarnMappingsVersion=1.20.1+build.10
# Architectury names the 1.20.1 NeoForge platform "forge" (see docs.architectury.dev/loom/using_neo)
enabledPlatforms=fabric,forge
fabricLoaderVersion=0.16.7
fabricApiVersion=0.92.2+1.20.1
# Must match the Kotlin Gradle plugin version (2.4.20): Architectury Loom 1.9 remaps Kotlin
# classes through kotlin-metadata-jvm, which cannot rewrite metadata newer than its own Kotlin.
# Some dependencies (cardinal-components-api 5.2.x) already carry Kotlin 2.4 metadata, and this is
# also the Kotlin that fabric-language-kotlin 1.14.1 ships, so all three stay in lockstep.
fabricKotlinVersion=1.14.1+kotlin.2.4.20
architecturyVersion=9.2.14
# MixinExtras is bundled by Fabric Loader 0.16.x, but NeoForge 1.20.1 does not ship it,
# so the neoforge jar embeds it via Jar-in-Jar. 0.4.1 is what Fabric Loader bundles,
# which keeps mixin behaviour identical across both platforms.
mixinExtrasVersion=0.4.1
cardinalComponentsVersion=5.2.1
clothConfigVersion=11.1.106
cca_version=5.2.1
entityReachVersion=2.3.0
serializationHooksVersion=0.4.99999
trinketsVersion=3.7.0

# neoforge
# On 1.20.1 NeoForge publishes under the `net.neoforged:forge` coordinates and
# still uses net.minecraftforge.* packages + the "forge" mod id.
neoforgeVersion=1.20.1-47.1.106
neoforgeKotlinVersion=4.12.0

# hex casting
hexcastingVersion=0.11.4
hexalVersion=0.3.1
moreiotasVersion=0.1.2
paucalVersion=0.6.0-pre-118
patchouliVersion=85
