plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "me.modmuss50.mod-publish-plugin" version "0.3.0"
}

archivesBaseName = getArtifactId("neoforge")

architectury {
    platformSetupLoomIde()
    // For Minecraft 1.20.1 Architectury Loom still calls the NeoForge platform "forge";
    // only the loader artifact differs (net.neoforged:forge instead of net.minecraftforge:forge).
    // See https://docs.architectury.dev/loom/using_neo
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "oneironaut-common.mixins.json"
        mixinConfig "oneironaut.mixins.json"
    }
    runs {
        client {
            programArgs(["--username", "beholderface", "--uuid", "21df30f7-6652-4f02-9b70-f95c1f051c9f"])
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    modCompileOnly(group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2') // for @Nonnull

    // NeoForge for 1.20.1 is published as net.neoforged:forge and keeps net.minecraftforge.* packages.
    forge "net.neoforged:forge:${project.neoforgeVersion}"
    modApi "dev.architectury:architectury-forge:${project.architecturyVersion}"

    // Hex Casting and friends. The hexisle pack ships the Forge builds of all of these,
    // so the NeoForge build links against the very same artifacts.
    modCompileOnly("at.petra-k.hexcasting:hexcasting-forge-${project.minecraftVersion}:${project.hexcastingVersion}") {
        transitive = false
    }
    modCompileOnly("at.petra-k.paucal:paucal-forge-${minecraftVersion}:${paucalVersion}") { transitive = false }
    modCompileOnly("ram.talia.hexal:hexal-forge-${minecraftVersion}:${hexalVersion}") { transitive = false }
    modCompileOnly("ram.talia.moreiotas:moreiotas-forge-${minecraftVersion}:${moreiotasVersion}") { transitive = false }
    modCompileOnly "vazkii.patchouli:Patchouli:${minecraftVersion}-${patchouliVersion}-FORGE"

    modRuntimeOnly("at.petra-k.hexcasting:hexcasting-forge-${project.minecraftVersion}:${project.hexcastingVersion}") {
        transitive = false
    }
    modRuntimeOnly("at.petra-k.paucal:paucal-forge-${minecraftVersion}:${paucalVersion}") { transitive = false }
    modRuntimeOnly("ram.talia.hexal:hexal-forge-${minecraftVersion}:${hexalVersion}") { transitive = false }
    modRuntimeOnly("ram.talia.moreiotas:moreiotas-forge-${minecraftVersion}:${moreiotasVersion}") { transitive = false }
    modRuntimeOnly "vazkii.patchouli:Patchouli:${minecraftVersion}-${patchouliVersion}-FORGE"

    // Kotlin runtime for the mod's .kt sources. The pack ships the same wrapper jar; FML unpacks it.
    modRuntimeOnly "thedarkcolour:kotlinforforge:$project.neoforgeKotlinVersion"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    // NeoForge 1.20.1 does not bundle MixinExtras, but common/ mixins use @WrapOperation/@WrapMethod,
    // so it has to ride along inside the jar.
    modImplementation(include("io.github.llamalad7:mixinextras-forge:${project.mixinExtrasVersion}"))
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    // Cardinal Components is a Fabric-only dependency here: the hexisle pack ships only CCA's
    // Fabric build (for Sinytra Connector), so a native NeoForge mod must not touch it. Shared code
    // now reaches the decorative-wisp flag through OneironautPlatform instead, leaving these three
    // classes unreferenced; drop them so the NeoForge jar carries no CCA bytecode at all.
    exclude "net/beholderface/oneironaut/components/**"
    exclude "net/beholderface/oneironaut/registry/OneironautComponents.class"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// this fixes mod's hex notebook additions missing in dev runtime because of something with how patchouli handles its data
// the only other thing that could fix it was adding common's resources to srcDirs directly,
// but that lead to the built jar causing mixin injection crashes in non-dev environments
// feel free to reach out if you manage to fix this without copying the book data
tasks.register("clearGeneratedBook", Delete) {
    description "Clear the book in generated resources."

    delete "src/generated/resources/$bookPath"
}
tasks.register("copyBookToGenerated", Copy) {
    description "Copy the book from resources to generated resources."

    from "../common/src/main/resources/$bookPath"
    into "src/generated/resources/$bookPath"
}
tasks.copyBookToGenerated.dependsOn(tasks.clearGeneratedBook)
tasks.processResources.dependsOn(tasks.copyBookToGenerated)
tasks.sourcesJar.dependsOn(tasks.copyBookToGenerated)

publishing {
    publications {
        mavenNeoforge(MavenPublication) {
            artifactId = project.archivesBaseName + "-" + project.name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}

publishMods {
    file = remapJar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)
    changelog = getLatestChangelog()
    type = STABLE
    modLoaders.add("neoforge")

    version = project.version + "-neoforge"
    displayName = "Oneironaut $project.version [NeoForge]"

